name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.configuration }} | ${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [AnyCPU]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: dotnet restore QuickLook.Plugin.SnpViewer.sln

      - name: Build solution
        run: |
          dotnet build QuickLook.Plugin.SnpViewer.sln `
              --no-restore `
              -c ${{ matrix.configuration }} `
              -p:Platform="${{ matrix.platform == 'AnyCPU' && 'Any CPU' || matrix.platform }}"

      # Publish + zip via the same script used for local packaging, so CI
      # and local builds can never drift apart. Publish (not raw build
      # output) is used because it reliably stages NuGet dependency
      # assemblies such as OxyPlot next to the plugin DLL.
      - name: Package as .qlplugin
        shell: pwsh
        run: ./package.ps1 -Configuration ${{ matrix.configuration }} -Platform ${{ matrix.platform }}

      - name: Upload .qlplugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook.Plugin.SnpViewer-${{ matrix.configuration }}-${{ matrix.platform }}
          path: QuickLook.Plugin.SnpViewer.qlplugin
          if-no-files-found: error
          retention-days: 30

  test:
    name: Unit tests
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/QuickLook.Plugin.SnpViewer.Tests.csproj

      - name: Test
        run: dotnet test tests/QuickLook.Plugin.SnpViewer.Tests.csproj --no-restore --logger "console;verbosity=normal"
