name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.configuration }} | ${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [AnyCPU]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: dotnet restore QuickLook.Plugin.SnpViewer.sln

      - name: Build solution
        run: |
          dotnet build QuickLook.Plugin.SnpViewer.sln `
              --no-restore `
              -c ${{ matrix.configuration }} `
              -p:Platform="${{ matrix.platform == 'AnyCPU' && 'Any CPU' || matrix.platform }}"

      - name: Verify output
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "Build/${{ matrix.configuration }}/QuickLook.Plugin/QuickLook.Plugin.SnpViewer"
          if (-not (Test-Path $dir)) { throw "Build output not found at $dir" }
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize

      - name: Package as .qlplugin
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "Build/${{ matrix.configuration }}/QuickLook.Plugin/QuickLook.Plugin.SnpViewer"
          $dst = Join-Path $env:GITHUB_WORKSPACE "QuickLook.Plugin.SnpViewer.qlplugin"
          if (-not (Test-Path $src)) { throw "Source dir not found: $src" }
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $dst -Force
          Get-Item $dst | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload .qlplugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook.Plugin.SnpViewer-${{ matrix.configuration }}-${{ matrix.platform }}
          path: QuickLook.Plugin.SnpViewer.qlplugin
          if-no-files-found: error
          retention-days: 30

  test:
    name: Unit tests
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/QuickLook.Plugin.SnpViewer.Tests.csproj

      - name: Test
        run: dotnet test tests/QuickLook.Plugin.SnpViewer.Tests.csproj --no-restore --logger "console;verbosity=normal"
